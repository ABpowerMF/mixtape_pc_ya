name: Mixtape Desktop

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Works with any of these in the repo:
      #  - the zip (any name with "desktop" in it, in any folder, even "Mixtape-Desktop-v0.1 (1).zip")
      #  - the project itself (the unzipped folder, or its files right in the repo root)
      - name: Find the project
        shell: pwsh
        run: |
          Write-Host "Files in the repo:"
          Get-ChildItem -Recurse -Depth 2 -File | Where-Object { $_.FullName -notmatch '\\.git\\' } | ForEach-Object { Write-Host "  $($_.FullName.Substring($PWD.Path.Length + 1))" }

          $zips = Get-ChildItem -Recurse -File -Filter *.zip | Where-Object { $_.Name -match 'desktop' -and $_.FullName -notmatch '\\.git\\' }
          if ($zips) {
            $zip = $zips | Sort-Object { if ($_.Name -match 'v(\d+(\.\d+)*)') { [version]("$($Matches[1]).0.0" -replace '^(\d+\.\d+\.\d+).*','$1') } else { [version]'0.0.0' } } | Select-Object -Last 1
            Write-Host "Using zip: $($zip.Name)"
            Expand-Archive -Path $zip.FullName -DestinationPath build-src -Force
            $search = 'build-src'
          } else {
            Write-Host "No desktop zip found: looking for the project files in the repo"
            $search = '.'
          }
          $pkg = Get-ChildItem -Path $search -Recurse -File -Filter package.json |
            Where-Object { $_.FullName -notmatch 'node_modules' -and (Get-Content $_.FullName -Raw) -match '"mixtape-desktop"' } |
            Select-Object -First 1
          if (-not $pkg) { Write-Error "Couldn't find the Mixtape Desktop project (no zip with 'desktop' in its name, and no package.json for mixtape-desktop)."; exit 1 }
          $dir = $pkg.DirectoryName
          $version = (Get-Content $pkg.FullName -Raw | ConvertFrom-Json).version
          Write-Host "Project folder: $dir  (version $version)"
          "PROJECT=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: ${{ env.PROJECT }}
        run: npm install --no-audit --no-fund

      - name: Build the Windows app
        working-directory: ${{ env.PROJECT }}
        run: npx electron-builder --win --publish never

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ env.VERSION }}
          name: Mixtape for PC v${{ env.VERSION }}
          files: |
            ${{ env.PROJECT }}/dist/*.exe
